<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171019">
  <title>A Little Love Letter</title>
  <style>
    :root {
      --ink: #fffaf7;
      --soft-pink: #ffdfe7;
      --rose: #d66f91;
      --deep: #171019;
      --glass: rgba(255, 250, 247, 0.09);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 182, 202, 0.20), transparent 24rem),
        linear-gradient(145deg, #251724 0%, #171019 55%, #100d13 100%);
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.32;
      animation: float-orb 12s ease-in-out infinite alternate;
    }

    .orb-one {
      width: 24rem;
      height: 24rem;
      left: -9rem;
      bottom: -8rem;
      background: #c94f7d;
    }

    .orb-two {
      width: 18rem;
      height: 18rem;
      right: -6rem;
      top: 8%;
      background: #e9a56b;
      animation-delay: -4s;
    }

    @keyframes float-orb {
      to { transform: translate3d(1.5rem, -2.5rem, 0) scale(1.08); }
    }

    .petal {
      position: absolute;
      width: 11px;
      height: 22px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(145deg, rgba(255, 240, 231, 0.9), rgba(225, 133, 163, 0.45));
      box-shadow: 0 0 12px rgba(255, 218, 226, 0.35);
      animation: fall var(--duration) linear var(--delay) infinite;
      opacity: 0;
    }

    @keyframes fall {
      0% { transform: translate3d(0, -12vh, 0) rotate(0deg); opacity: 0; }
      12% { opacity: 0.8; }
      85% { opacity: 0.55; }
      100% { transform: translate3d(var(--drift), 112vh, 0) rotate(560deg); opacity: 0; }
    }

    .welcome {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      transition: opacity 700ms ease, transform 700ms ease, visibility 700ms;
    }

    .welcome.hidden {
      opacity: 0;
      transform: scale(1.04);
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      width: min(520px, 92vw);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--soft-pink);
      font-size: clamp(0.7rem, 2vw, 0.82rem);
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.35rem, 9vw, 4.8rem);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    .subtitle {
      margin: 18px auto 34px;
      max-width: 28rem;
      color: rgba(255, 250, 247, 0.72);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 3vw, 1.22rem);
      font-style: italic;
      line-height: 1.55;
    }

    .letter-emblem {
      position: relative;
      display: grid;
      width: clamp(128px, 34vw, 158px);
      height: clamp(128px, 34vw, 158px);
      place-items: center;
      margin: 20px auto 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 28%, rgba(255, 255, 255, 0.22), transparent 18%),
        linear-gradient(145deg, #d77a9b, #9d4f70);
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.35),
        0 0 0 10px rgba(255, 255, 255, 0.035),
        0 0 55px rgba(231, 138, 166, 0.28);
    }

    .letter-emblem::before,
    .letter-emblem::after {
      content: "";
      position: absolute;
      inset: -10px;
      border: 1px solid rgba(255, 219, 229, 0.28);
      border-radius: inherit;
      animation: pulse-ring 2.8s ease-out infinite;
    }

    .letter-emblem::after { animation-delay: 1.4s; }

    @keyframes pulse-ring {
      0% { transform: scale(0.88); opacity: 0; }
      28% { opacity: 0.75; }
      100% { transform: scale(1.26); opacity: 0; }
    }

    .letter-emoji {
      font-size: clamp(3.4rem, 12vw, 5.2rem);
      filter: drop-shadow(0 8px 12px rgba(68, 20, 43, 0.28));
      transform: translateY(-2px);
    }

    .unlock-form {
      display: grid;
      gap: 10px;
      width: min(360px, 100%);
      margin: 0 auto;
      text-align: left;
    }

    .unlock-form input {
      width: 100%;
      min-height: 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 12px 15px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
      font: inherit;
      text-align: center;
    }

    .unlock-form input::placeholder { color: rgba(255, 250, 247, 0.45); }

    .unlock-form input:focus-visible {
      outline: 2px solid rgba(255, 223, 231, 0.9);
      outline-offset: 3px;
    }

    .unlock-hint {
      margin: 2px 0;
      color: rgba(255, 250, 247, 0.74);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.98rem;
      font-style: italic;
      line-height: 1.5;
      text-align: center;
    }

    .unlock-status {
      min-height: 1.4em;
      margin: 0;
      color: #ffc0c0;
      font-size: 0.88rem;
      text-align: center;
    }

    .unlock-button {
      min-height: 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, #d77a9b, #9d4f70);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 200ms ease, box-shadow 200ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .unlock-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.32);
    }

    .unlock-button:active { transform: scale(0.98); }

    .music-control {
      position: fixed;
      z-index: 12;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      display: grid;
      width: 76px;
      height: 76px;
      place-items: center;
      border: 1px solid rgba(255, 239, 213, 0.42);
      border-radius: 50%;
      color: #f7d99b;
      background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.16), rgba(38,25,30,0.9) 72%);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), 0 0 25px rgba(231, 190, 119, 0.16);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .music-control svg {
      width: 58px;
      height: 58px;
      overflow: visible;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35));
    }

    .music-notes {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .music-note {
      position: absolute;
      top: 10px;
      left: 44px;
      color: #ffe8ad;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.1rem;
      opacity: 0;
      text-shadow: 0 0 10px rgba(255, 223, 153, 0.75);
    }

    .music-control.is-playing .music-note {
      animation: music-note-float 2.5s ease-out infinite;
    }

    .music-control.is-playing .music-note:nth-child(2) {
      animation-delay: -0.85s;
      left: 54px;
      top: 4px;
    }

    .music-control.is-playing .music-note:nth-child(3) {
      animation-delay: -1.7s;
      left: 38px;
      top: 1px;
    }

    @keyframes music-note-float {
      0% { opacity: 0; transform: translate(0, 8px) scale(0.7) rotate(-8deg); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(12px, -38px) scale(1.1) rotate(12deg); }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .video-stage {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      background: transparent;
      transition: opacity 700ms ease, visibility 700ms;
    }

    .video-stage.open {
      opacity: 1;
      visibility: visible;
    }

    .video-frame {
      position: relative;
      height: min(92svh, 920px);
      aspect-ratio: 9 / 16;
      max-width: calc(100vw - 32px);
      overflow: hidden;
      transform: scale(0.92) translateY(18px);
      transition: transform 900ms cubic-bezier(.16,1,.3,1);
    }

    .video-stage.open .video-frame {
      transform: scale(1) translateY(0);
    }

    #flowerCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .floating-messages {
      position: fixed;
      z-index: 7;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .floating-message {
      position: absolute;
      bottom: -5rem;
      display: block;
      width: max-content;
      max-width: min(280px, calc(100vw - 32px));
      padding: 10px 14px;
      border: 1px solid rgba(255, 239, 244, 0.22);
      border-radius: 18px;
      color: #fffaf7;
      background: rgba(37, 23, 36, 0.72);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(8px);
      font-size: clamp(0.78rem, 2.8vw, 0.98rem);
      line-height: 1.4;
      text-wrap: pretty;
      opacity: 0;
      animation: float-message var(--float-duration) ease-in-out var(--float-delay) both;
      will-change: opacity, transform;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    .floating-message.dragging {
      z-index: 1;
      animation-play-state: paused;
      cursor: grabbing;
      filter: brightness(1.12);
    }

    @keyframes float-message {
      0% {
        opacity: 0;
        transform: translate3d(var(--drag-x, 0px), var(--drag-y, 0px), 0) rotate(var(--float-start-rotation));
      }
      10% { opacity: 0.94; }
      84% { opacity: 0.84; }
      100% {
        opacity: 0;
        transform: translate3d(calc(var(--float-drift) + var(--drag-x, 0px)), calc(-125vh + var(--drag-y, 0px)), 0) rotate(var(--float-end-rotation));
      }
    }

    .close-button {
      position: fixed;
      z-index: 10;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      background: rgba(20, 13, 19, 0.58);
      backdrop-filter: blur(12px);
      cursor: pointer;
      font-size: 1.4rem;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 400ms ease 500ms, transform 400ms ease 500ms;
    }

    .video-stage.open .close-button {
      opacity: 1;
      transform: translateY(0);
    }

    .close-button:focus-visible,
    .unlock-button:focus-visible,
    .music-control:focus-visible,
    .thank-you-trigger:focus-visible,
    .thank-you-close:focus-visible,
    .thank-you-submit:focus-visible {
      outline: 3px solid rgba(255, 223, 231, 0.95);
      outline-offset: 5px;
    }

    .thank-you-trigger {
      position: fixed;
      z-index: 8;
      right: 20px;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 20px;
      width: fit-content;
      max-width: calc(100vw - 40px);
      margin: 0 auto;
      padding: 14px 22px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, #d77a9b, #9d4f70);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35), 0 0 35px rgba(231, 138, 166, 0.25);
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 500ms ease, transform 500ms ease, box-shadow 250ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .thank-you-trigger[hidden] { display: none; }
    .thank-you-trigger.visible { opacity: 1; transform: translateY(0); }
    .thank-you-trigger:hover { box-shadow: 0 16px 42px rgba(0, 0, 0, 0.4), 0 0 42px rgba(231, 138, 166, 0.4); }

    .thank-you-dialog {
      width: min(440px, calc(100vw - 32px));
      max-height: min(88svh, 720px);
      padding: 0;
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      color: var(--ink);
      background: linear-gradient(155deg, #302331, #171019 75%);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
    }

    .thank-you-dialog::backdrop {
      background: rgba(11, 8, 13, 0.72);
      backdrop-filter: blur(8px);
    }

    .thank-you-content { position: relative; padding: 32px clamp(22px, 6vw, 36px); }

    .thank-you-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      color: white;
      background: rgba(255, 255, 255, 0.07);
      cursor: pointer;
      font-size: 1.35rem;
    }

    .thank-you-content .eyebrow { margin: 0 40px 10px 0; }

    .thank-you-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 8vw, 2.45rem);
      font-weight: 400;
      letter-spacing: -0.035em;
    }

    .thank-you-form { display: grid; gap: 10px; }

    .thank-you-form label {
      margin-top: 6px;
      color: rgba(255, 250, 247, 0.86);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .thank-you-form input,
    .thank-you-form textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.07);
      font: inherit;
    }

    .thank-you-form textarea { min-height: 130px; resize: vertical; }
    .thank-you-form input::placeholder,
    .thank-you-form textarea::placeholder { color: rgba(255, 250, 247, 0.44); }

    .thank-you-form input:focus-visible,
    .thank-you-form textarea:focus-visible {
      outline: 2px solid rgba(255, 223, 231, 0.85);
      outline-offset: 2px;
    }

    .thank-you-status {
      min-height: 1.4em;
      margin: 2px 0 0;
      color: rgba(255, 250, 247, 0.78);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .thank-you-status.error { color: #ffc0c0; }
    .thank-you-status.success { color: #c8f2d2; }

    .thank-you-submit {
      min-height: 48px;
      margin-top: 4px;
      border: 0;
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, #d77a9b, #9d4f70);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .thank-you-submit:disabled { cursor: wait; opacity: 0.72; }

    .music-control:focus-visible {
      outline: 3px solid rgba(255, 223, 231, 0.95);
      outline-offset: 5px;
    }

    @media (orientation: portrait) and (max-width: 600px) {
      .video-frame {
        height: 100svh;
        max-width: 100vw;
      }

      .floating-message { padding: 9px 12px; }
      .thank-you-content { padding-top: 28px; }
    }

    @media (orientation: landscape) and (max-height: 700px) {
      .welcome { padding: 12px 24px; }
      h1 { font-size: clamp(2.2rem, 8vh, 3.5rem); }
      .subtitle { margin: 10px auto 16px; }
      .letter-emblem { width: 112px; height: 112px; margin: 10px auto; }
      .letter-emoji { font-size: 3.2rem; }
      .unlock-form { gap: 7px; }
      .video-frame { height: 94svh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb, .petal, .letter-emblem::before, .letter-emblem::after {
        animation: none;
      }
      .welcome, .video-stage, .video-frame, .close-button, .thank-you-trigger, .unlock-button {
        transition-duration: 1ms;
      }
      .floating-messages { display: none; }
      .music-control.is-playing .music-note {
        animation: none;
        opacity: 0.9;
      }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
  </div>

  <main class="welcome" id="welcome">
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">A little something for you</p>
      <h1 id="title">Simrity Bhat</h1>
      <p class="subtitle">A flower blooms, a moment opens, and a little love finds its way to you.</p>
      <div class="letter-emblem" aria-hidden="true"><span class="letter-emoji">💌</span></div>
      <form class="unlock-form" id="unlockForm">
        <p class="unlock-hint">Hint: “Knock Knock ..✊ It's Lettuce..!”</p>
        <input id="unlockPassword" name="password" type="password" aria-label="Password" required autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your password">
        <p class="unlock-status" id="unlockStatus" role="status" aria-live="polite"></p>
        <button class="unlock-button" type="submit">Unlock the flower</button>
      </form>
    </section>
  </main>

  <audio id="backgroundMusic" src="assets/Sukh-Kalale.mp3" preload="auto" loop></audio>
  <button class="music-control" id="musicControl" type="button" aria-label="Play background music" aria-pressed="false">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M31 28 19 18c-2-2-2-5 0-7C25 3 35 1 43 4l16 7-11 20c-5-3-11-4-17-3Z" fill="#e6bd70" stroke="#fff0c7" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="m22 13 27 13M27 8l25 13M35 5l20 10" fill="none" stroke="#9c6e37" stroke-width="1.4" stroke-linecap="round"/>
      <path d="m31 28 7 11M39 39l7 7M14 48h37l6 7H9l5-7Z" fill="#b97869" stroke="#f4cba2" stroke-width="1.5" stroke-linejoin="round"/>
      <ellipse cx="30" cy="47" rx="11" ry="3.5" fill="#49333a" stroke="#f4cba2" stroke-width="1.5"/>
      <ellipse cx="30" cy="47" rx="5.5" ry="2" fill="#d5aa62"/>
      <path d="m45 46-3-11-8 2" fill="none" stroke="#f4cba2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="34" cy="37" r="2" fill="#ffe5a7"/>
    </svg>
    <span class="music-notes" aria-hidden="true"><span class="music-note">♪</span><span class="music-note">♫</span><span class="music-note">♪</span></span>
  </button>
  <span class="visually-hidden" id="musicStatus" role="status" aria-live="polite"></span>

  <section class="video-stage" id="videoStage" aria-label="Animated love letter" aria-hidden="true">
    <button class="close-button" id="closeLetter" type="button" aria-label="Close flower animation">×</button>
    <div class="video-frame">
      <canvas id="flowerCanvas" width="540" height="960" aria-label="Animated lily blooming"></canvas>
    </div>
    <div class="floating-messages" id="floatingMessages" aria-hidden="true"></div>
    <button class="thank-you-trigger" id="thankYouTrigger" type="button" hidden>Say thank you to Harshal 💌</button>
    <dialog class="thank-you-dialog" id="thankYouDialog" aria-labelledby="thankYouTitle">
      <div class="thank-you-content">
        <button class="thank-you-close" id="closeThankYou" type="button" aria-label="Close thank-you form">×</button>
        <p class="eyebrow">A little note</p>
        <h2 class="thank-you-title" id="thankYouTitle">Leave a thank-you</h2>
        <form class="thank-you-form" id="thankYouForm" action="https://api.web3forms.com/submit" method="POST">
          <input type="hidden" name="access_key" value="475cb65d-385d-437e-b499-2293ffde433d">
          <input type="hidden" name="subject" value="A thank-you note from the lily bouquet page">
          <input type="hidden" name="from_name" value="Lily Bouquet">
          <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" style="display: none;">
          <label for="thankYouMessage">Your message</label>
          <textarea id="thankYouMessage" name="message" maxlength="1500" required placeholder="Write your thank-you note here..."></textarea>
          <p class="thank-you-status" id="thankYouStatus" role="status" aria-live="polite"></p>
          <button class="thank-you-submit" id="sendThankYou" type="submit">Send thank-you note</button>
        </form>
      </div>
    </dialog>
  </section>

  <script>
    const welcome = document.getElementById("welcome");
    const stage = document.getElementById("videoStage");
    const closeButton = document.getElementById("closeLetter");
    const unlockForm = document.getElementById("unlockForm");
    const unlockPassword = document.getElementById("unlockPassword");
    const unlockStatus = document.getElementById("unlockStatus");
    const backgroundMusic = document.getElementById("backgroundMusic");
    const musicControl = document.getElementById("musicControl");
    const musicStatus = document.getElementById("musicStatus");
    const thankYouTrigger = document.getElementById("thankYouTrigger");
    const thankYouDialog = document.getElementById("thankYouDialog");
    const closeThankYouButton = document.getElementById("closeThankYou");
    const thankYouForm = document.getElementById("thankYouForm");
    const thankYouStatus = document.getElementById("thankYouStatus");
    const sendThankYouButton = document.getElementById("sendThankYou");
    const floatingMessages = document.getElementById("floatingMessages");
    const canvas = document.getElementById("flowerCanvas");
    const context = canvas.getContext("2d");
    const title = document.getElementById("title");
    const frameCount = 195;
    const frameRate = 15;
    const thankYouDelay = 14000;
    const unlockPhrase = "let us go out on a date";
    const floatingMessageLines = [
      "Apko kya pasand hai..Insaan🧍‍♂️ Ya Bandar 🐒",
      "I never sung a song to someone bhhaaiii",
      "😂😂simrity inside me wants to kill me",
      "Daammnn kyaaa gaayaa haii🥺🥹🫶🏻❤️",
      "Coffee pinaa hai naa 😂😂🤣",
      "Shutup 😂",
      "Bandarrrrrrr🥹",
      "Eewwwww",
      "Sssshhiii",
      "Tu saaans nai le payegaa aisee baithii toh",
      "😂🙈sshii bhaai basss",
      "I am good at reading whole person>>",
      "That heart has a purpose <3",
      "Sure i would love that too",
      "🤎🤎🤎",
      "In your dreamsss",
      "Mai toh teri sweatwr ki baat karriiii",
      "What do you wantt",
      "Hoodiessas",
      "Shirtsssss",
      "Belts to hit youu",
      "Undiess",
      "😏✨🌸"
    ];
    const frames = [];
    let animationId = 0;
    let thankYouTimer = 0;

    function framePath(index) {
      return `lily_frames/frame_${String(index).padStart(3, "0")}.webp?v=4`;
    }

    function loadFrames() {
      for (let i = 1; i <= frameCount; i++) {
        const image = new Image();
        image.decoding = "async";
        image.onload = () => {
          if (i === 1) drawFrame(image);
        };
        image.onerror = () => console.error(`Could not load flower frame ${i}`);
        image.src = framePath(i);
        frames[i - 1] = image;
      }
    }

    function drawFrame(image) {
      if (!image?.complete || !image.naturalWidth) return;
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
    }

    function normalizePhrase(value) {
      return value
        .normalize("NFKC")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim()
        .replace(/\s+/g, " ");
    }

    function handleUnlock(event) {
      event.preventDefault();
      if (normalizePhrase(unlockPassword.value) !== normalizePhrase(unlockPhrase)) {
        unlockStatus.textContent = "Not quite—try the hint again 💌";
        unlockPassword.select();
        return;
      }

      unlockStatus.textContent = "";
      unlockForm.reset();
      openLetter();
    }

    let musicManuallyControlled = false;
    let musicLoadFailed = false;

    function updateMusicControl() {
      const isPlaying = !backgroundMusic.paused && !backgroundMusic.ended;
      musicControl.classList.toggle("is-playing", isPlaying);
      musicControl.setAttribute("aria-pressed", String(isPlaying));
      musicControl.setAttribute("aria-label", isPlaying ? "Pause background music" : "Play background music");
      if (isPlaying) musicStatus.textContent = "";
    }

    async function playMusic() {
      if (musicLoadFailed) return;

      try {
        await backgroundMusic.play();
      } catch (error) {
        if (error.name === "NotAllowedError") {
          if (backgroundMusic.paused) musicStatus.textContent = "Tap anywhere or the gramophone to start the music.";
          return;
        }

        musicStatus.textContent = "The music could not be played.";
        console.error("Could not play the background music.", error);
      }
    }

    function handleMusicInteraction(event) {
      if (
        musicControl.contains(event.target)
        || musicManuallyControlled
        || musicLoadFailed
        || !backgroundMusic.paused
      ) return;
      void playMusic();
    }

    function toggleMusic() {
      musicManuallyControlled = true;
      if (backgroundMusic.paused) {
        void playMusic();
      } else {
        backgroundMusic.pause();
      }
    }

    backgroundMusic.volume = 0.28;
    backgroundMusic.addEventListener("play", updateMusicControl);
    backgroundMusic.addEventListener("pause", updateMusicControl);
    backgroundMusic.addEventListener("error", () => {
      musicLoadFailed = true;
      musicStatus.textContent = "The music file could not be loaded.";
      console.error(`Could not load background music: ${backgroundMusic.currentSrc}`);
    });
    musicControl.addEventListener("click", toggleMusic);
    document.addEventListener("pointerdown", handleMusicInteraction, { passive: true });
    document.addEventListener("keydown", handleMusicInteraction);

    function makeMessageDraggable(message) {
      let drag = null;

      message.addEventListener("pointerdown", (event) => {
        if (event.isPrimary === false || (event.button !== undefined && event.button !== 0)) return;
        const bounds = message.getBoundingClientRect();
        drag = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          initialX: Number.parseFloat(message.style.getPropertyValue("--drag-x")) || 0,
          initialY: Number.parseFloat(message.style.getPropertyValue("--drag-y")) || 0,
          minX: -bounds.left,
          maxX: window.innerWidth - bounds.right,
          minY: -bounds.top,
          maxY: window.innerHeight - bounds.bottom
        };
        message.classList.add("dragging");
        if (message.setPointerCapture) message.setPointerCapture(event.pointerId);
        event.preventDefault();
      });

      message.addEventListener("pointermove", (event) => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        const offsetX = Math.max(drag.minX, Math.min(drag.maxX, event.clientX - drag.startX));
        const offsetY = Math.max(drag.minY, Math.min(drag.maxY, event.clientY - drag.startY));
        message.style.setProperty("--drag-x", `${drag.initialX + offsetX}px`);
        message.style.setProperty("--drag-y", `${drag.initialY + offsetY}px`);
      });

      const endDrag = (event) => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        drag = null;
        message.classList.remove("dragging");
      };

      message.addEventListener("pointerup", endDrag);
      message.addEventListener("pointercancel", endDrag);
      message.addEventListener("animationend", () => message.remove());
    }

    function startFloatingMessages() {
      floatingMessages.replaceChildren();
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const maxMessageWidth = Math.min(280, Math.max(0, window.innerWidth - 32));
      const horizontalRange = Math.max(0, window.innerWidth - maxMessageWidth - 32);

      floatingMessageLines.forEach((text, index) => {
        const message = document.createElement("span");
        message.className = "floating-message";
        message.textContent = text;
        message.style.left = `${16 + Math.random() * horizontalRange}px`;
        message.style.setProperty("--float-duration", `${9 + Math.random() * 4}s`);
        message.style.setProperty("--float-delay", `${index * 1.2}s`);
        message.style.setProperty("--float-drift", `${Math.round(-45 + Math.random() * 90)}px`);
        message.style.setProperty("--float-start-rotation", `${Math.round(-5 + Math.random() * 10)}deg`);
        message.style.setProperty("--float-end-rotation", `${Math.round(-8 + Math.random() * 16)}deg`);
        makeMessageDraggable(message);
        floatingMessages.appendChild(message);
      });
    }

    function startFlowerAnimation() {
      cancelAnimationFrame(animationId);
      window.clearTimeout(thankYouTimer);
      thankYouTrigger.hidden = true;
      thankYouTrigger.classList.remove("visible");
      floatingMessages.replaceChildren();
      const startedAt = performance.now();

      function tick(now) {
        const elapsed = (now - startedAt) / 1000;
        const frameIndex = Math.min(frameCount - 1, Math.floor(elapsed * frameRate));
        const image = frames[frameIndex];
        if (image?.complete) drawFrame(image);

        if (frameIndex < frameCount - 1 || !image?.complete) {
          animationId = requestAnimationFrame(tick);
        } else {
          startFloatingMessages();
        }
      }

      drawFrame(frames[0]);
      animationId = requestAnimationFrame(tick);
    }

    const recipient = new URLSearchParams(window.location.search).get("to")?.trim().slice(0, 32);
    if (recipient) {
      title.textContent = `For ${recipient}`;
      document.title = `For ${recipient} — A Little Love Letter`;
    }

    function makePetals() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const ambient = document.querySelector(".ambient");
      for (let i = 0; i < 18; i++) {
        const petal = document.createElement("span");
        petal.className = "petal";
        petal.style.left = `${Math.random() * 100}%`;
        petal.style.setProperty("--duration", `${9 + Math.random() * 8}s`);
        petal.style.setProperty("--delay", `${-Math.random() * 14}s`);
        petal.style.setProperty("--drift", `${-70 + Math.random() * 140}px`);
        petal.style.transform = `scale(${0.55 + Math.random() * 0.9})`;
        ambient.appendChild(petal);
      }
    }

    function openLetter() {
      welcome.classList.add("hidden");
      stage.classList.add("open");
      stage.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      startFlowerAnimation();
      thankYouTimer = window.setTimeout(() => {
        if (!stage.classList.contains("open")) return;
        thankYouTrigger.hidden = false;
        requestAnimationFrame(() => thankYouTrigger.classList.add("visible"));
      }, thankYouDelay);
      closeButton.focus({ preventScroll: true });
    }

    function closeLetter() {
      cancelAnimationFrame(animationId);
      window.clearTimeout(thankYouTimer);
      thankYouTrigger.hidden = true;
      thankYouTrigger.classList.remove("visible");
      floatingMessages.replaceChildren();
      if (thankYouDialog.open) thankYouDialog.close();
      stage.classList.remove("open");
      stage.setAttribute("aria-hidden", "true");
      window.setTimeout(() => {
        welcome.classList.remove("hidden");
        unlockPassword.focus({ preventScroll: true });
      }, 350);
    }

    function openThankYouDialog() {
      thankYouForm.reset();
      thankYouStatus.textContent = "";
      thankYouStatus.className = "thank-you-status";
      sendThankYouButton.disabled = false;
      sendThankYouButton.textContent = "Send thank-you note";
      thankYouDialog.showModal();
    }

    async function sendThankYou(event) {
      event.preventDefault();
      const formData = new FormData(thankYouForm);
      const accessKey = String(formData.get("access_key") || "").trim();

      if (!accessKey || accessKey === "YOUR_WEB3FORMS_ACCESS_KEY") {
        thankYouStatus.className = "thank-you-status error";
        thankYouStatus.textContent = "Web3Forms needs an access key before notes can be sent.";
        return;
      }

      const payload = Object.fromEntries(formData.entries());
      sendThankYouButton.disabled = true;
      sendThankYouButton.textContent = "Sending...";
      thankYouStatus.className = "thank-you-status";
      thankYouStatus.textContent = "Sending your note...";

      try {
        const response = await fetch(thankYouForm.action, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || result.body?.message || "Web3Forms did not accept the message.");
        }

        thankYouStatus.className = "thank-you-status success";
        thankYouStatus.textContent = "Your note has been sent. Thank you for sharing it 💌";
        thankYouForm.reset();
        sendThankYouButton.textContent = "Sent";
      } catch (error) {
        console.error("Could not send the thank-you note through Web3Forms.", error);
        thankYouStatus.className = "thank-you-status error";
        thankYouStatus.textContent = "Your note could not be sent right now. Please try again.";
        sendThankYouButton.disabled = false;
        sendThankYouButton.textContent = "Try again";
      }
    }

    unlockForm.addEventListener("submit", handleUnlock);
    closeButton.addEventListener("click", closeLetter);
    thankYouTrigger.addEventListener("click", openThankYouDialog);
    closeThankYouButton.addEventListener("click", () => thankYouDialog.close());
    thankYouDialog.addEventListener("click", (event) => {
      if (event.target === thankYouDialog) thankYouDialog.close();
    });
    thankYouForm.addEventListener("submit", sendThankYou);
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (thankYouDialog.open) {
        event.preventDefault();
        thankYouDialog.close();
      } else if (stage.classList.contains("open")) {
        closeLetter();
      }
    });

    makePetals();
    loadFrames();
    void playMusic();
  </script>
</body>
</html>
