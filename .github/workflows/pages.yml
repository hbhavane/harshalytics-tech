name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            artifact_count=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$artifact_count" -eq 1 ]; then
              echo "Pages artifact is available."
              exit 0
            fi
            if [ "$artifact_count" -gt 1 ]; then
              echo "::error::Expected one Pages artifact, found $artifact_count."
              exit 1
            fi
            sleep 2
          done
          echo "::error::Pages artifact was not available after 20 seconds."
          exit 1
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
